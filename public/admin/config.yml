backend:
  name: github
  repo: curiositycornercc/curiositycornercc.github.io
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts & Recipes"
    label_singular: "Post"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Page Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Blog Article", value: "blog" }
          - { label: "Recipe", value: "recipe" }
          - { label: "Grooming", value: "grooming" }
          - { label: "Date Night", value: "date_night" }
        default: "blog"
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (Meta)", name: "description", widget: "text", hint: "Used for search engine meta descriptions." }
      - label: "Cover Image"
        name: "cover_image"
        widget: "object"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Alt Text", name: "alt", widget: "string" }
      - { label: "Body Content", name: "body", widget: "markdown" }
      - label: "Recipe Details"
        name: "recipe"
        widget: "object"
        required: false
        fields:
          - label: "Ingredients"
            name: "ingredients"
            widget: "list"
            field: { label: "Ingredient", name: "ingredient", widget: "string" }
          - label: "Method / Steps"
            name: "method"
            widget: "list"
            field: { label: "Step", name: "step", widget: "text" }