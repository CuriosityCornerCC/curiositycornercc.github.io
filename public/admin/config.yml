backend:
  name: github
  repo: curiositycornercc/curiositycornercc.github.io
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts & Recipes"
    label_singular: "Post"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Page Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Blog Article", value: "article" }
          - { label: "Recipe", value: "recipe" }
        default: "article"
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Description (Meta)", name: "description", widget: "text", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false }
      - { label: "Body Content", name: "body", widget: "markdown" }

      # Recipe Details Widget (Collapsed & optional for regular articles)
      - label: "Recipe Details"
        name: "recipeInfo"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Prep Time", name: "prepTime", widget: "string", required: false }
          - { label: "Cook Time", name: "cookTime", widget: "string", required: false }
          - { label: "Servings", name: "servings", widget: "string", required: false }
          - label: "Ingredients"
            name: "ingredients"
            widget: "list"
            required: false
            field: { label: "Ingredient", name: "ingredient", widget: "string" }
          - label: "Instructions"
            name: "instructions"
            widget: "list"
            required: false
            field: { label: "Step", name: "step", widget: "text" }