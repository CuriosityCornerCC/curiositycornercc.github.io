backend:
  name: github
  repo: curiositycornercc/curiositycornercc.github.io
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Page Type", name: "type", widget: "select", options: ["article", "recipe"], default: "article" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Crochet", "Grooming", "Date Night", "Tech", "Things to Do", "Local Flavor", "Recipes"], default: "General" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false, default: "/images/pic01.jpg" }
      - { label: "Featured Post", name: "featured", widget: "boolean", default: false, required: false }
      
      # Recipe Fields
      - { label: "Servings", name: "servings", widget: "number", value_type: "int", required: false }
      - { label: "Total Calories", name: "totalCalories", widget: "number", value_type: "int", required: false }
      - { label: "Prep Time", name: "prepTime", widget: "string", required: false, hint: "e.g. 15 mins" }
      - { label: "Cook Time", name: "cookTime", widget: "string", required: false, hint: "e.g. 45 mins" }
      - { label: "Ingredients", name: "ingredients", widget: "list", required: false }
      - { label: "Instructions", name: "instructions", widget: "list", required: false }

      - { label: "Body", name: "body", widget: "markdown" }